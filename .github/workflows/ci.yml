---
name: CI

"on":
  push:
    branches:
      - main
      - python-trade
  pull_request: {}
  workflow_dispatch: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff vulture pytest yamllint

      - name: Yamllint
        run: yamllint .github/workflows/*.yml

      - name: Ruff
        run: ruff check .

      - name: Vulture
        run: |
          vulture . --min-confidence 80 \
            --whitelist vulture_whitelist.py \
            --exclude backtests/results,backtests/reports,data/http_cache,data/source_snapshots,data/cache

      - name: Golden tests (optional)
        run: |
          if [ -f tests_integration/test_golden_snapshot.py ]; then
            pytest -q
          else
            echo "No golden tests"
          fi
